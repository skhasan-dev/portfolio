<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Loading…</title>

  <!-- Google Fonts — change font names in theme.js → fonts, then update families here -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,200..900&family=Fraunces:opsz,wght@9..144,100..900&family=Caveat:wght@500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ── NAV ──────────────────────────────────────────────── -->
  <header class="nav" id="siteNav">
    <div class="nav-pill" id="navPill"></div>
  </header>

  <main>

    <!-- ── HERO ─────────────────────────────────────────────── -->
    <section id="home" class="hero">
      <div class="hero-blob hero-blob-1"></div>
      <div class="hero-blob hero-blob-2"></div>
      <div class="hero-blob hero-blob-3"></div>
      <div class="wrap" id="heroContent"></div>
    </section>

    <!-- ── ABOUT ────────────────────────────────────────────── -->
    <section id="about">
      <div class="wrap" id="aboutContent"></div>
    </section>

    <!-- ── SKILLS ───────────────────────────────────────────── -->
    <section id="skills">
      <div class="wrap" id="skillsContent"></div>
    </section>

    <!-- ── PROJECTS ─────────────────────────────────────────── -->
    <section id="projects">
      <div class="wrap" id="projectsContent"></div>
    </section>

    <!-- ── EXPERIENCE ───────────────────────────────────────── -->
    <section id="experience">
      <div class="wrap" id="experienceContent"></div>
    </section>

    <!-- ── TESTIMONIALS ─────────────────────────────────────── -->
    <section id="testimonials">
      <div class="wrap" id="testimonialsContent"></div>
    </section>

    <!-- ── CONTACT ──────────────────────────────────────────── -->
    <section id="contact">
      <div class="wrap contact-grid" id="contactContent"></div>
    </section>

  </main>

  <!-- ── FOOTER ───────────────────────────────────────────── -->
  <footer>
    <div class="wrap footer-inner" id="footerContent"></div>
  </footer>

  <!-- ────────────────────────────────────────────────────────
       SCRIPT LOAD ORDER (do not change):
       1. theme.js            — injects CSS vars before any paint
       2. components/utils.js  — shared escapeHtml()
       3. components/buttons.js— generic button/icon builders
       4. components/reveal.js — shared scroll-entrance helper
       5. components/*.js      — one file per section
       6. main init            — inline below, fetches data.json then orchestrates everything
  ──────────────────────────────────────────────────────────── -->
  <script src="theme.js"></script>
  <script src="components/utils.js"></script>
  <script src="components/buttons.js"></script>
  <script src="components/reveal.js"></script>
  <script src="components/nav.js"></script>
  <script src="components/hero.js"></script>
  <script src="components/about.js"></script>
  <script src="components/skills.js"></script>
  <script src="components/projects.js"></script>
  <script src="components/experience.js"></script>
  <script src="components/testimonials.js"></script>
  <script src="components/contact.js"></script>

  <script>
    function renderFooter(container, personal) {
      container.innerHTML = `
        <span>© ${new Date().getFullYear()} ${personal.name}. Built with care.</span>
      `;
    }

    async function init() {
      let d;
      try {
        // no-store: data.json is overwritten in place on every Publish, so a
        // cached copy would silently show stale content to returning visitors.
        const res = await fetch('data.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`data.json request failed (${res.status})`);
        d = await res.json();
      } catch (err) {
        console.error('Failed to load portfolio data:', err);
        document.body.innerHTML = '<p style="padding:48px;font-family:sans-serif;color:#6B6B6B;">Unable to load portfolio content right now. Please try again shortly.</p>';
        return;
      }

      document.title = d.personal.name + ' — ' + d.personal.role;

      renderNav(document.getElementById('navPill'), d.personal, d.navLinks);
      renderHero(document.getElementById('heroContent'), d.personal);
      renderAbout(document.getElementById('aboutContent'), d.sections.about, d.about);
      renderSkills(document.getElementById('skillsContent'), d.sections.skills, d.skills);
      renderProjects(document.getElementById('projectsContent'), d.sections.projects, d.projectFilters, d.projects);
      renderExperience(document.getElementById('experienceContent'), d.sections.experience, d.experience, d.personal.resumePDF);
      renderTestimonials(document.getElementById('testimonials'), document.getElementById('testimonialsContent'), d.sections.testimonials, d.testimonials);
      renderContact(document.getElementById('contactContent'), d.sections.contact, d.personal);
      renderFooter(document.getElementById('footerContent'), d.personal);

      // Interactions
      initNavScroll();
      initHeroNameFit();
      initHeroLetterRipple();
      initSkillTabs();
      initProjectsFilmstrip();
      initExperienceTimeline();
      initContactCopy(d.personal.email);
      initContactForm();

      // Scroll-triggered entrance (hero plays on load instead)
      requestAnimationFrame(() => requestAnimationFrame(playHeroEntrance));
      registerSectionEntrance('about', 'about-anim', 0.2);
      registerSectionEntrance('skills', 'skills-anim', 0.2);
      registerSectionEntrance('projects', 'projects-anim', 0.15);
      registerSectionEntrance('experience', 'exp-anim', 0.15);
      registerSectionEntrance('testimonials', 'testi-anim', 0.2);
      registerSectionEntrance('contact', 'contact-anim', 0.15);
    }

    init();
  </script>

</body>

</html>
